<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob: data:; font-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repo Reader</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./favicon.png" type="image/png">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="topbar-heading">
                <div class="brand-row compact-brand">
                    <img class="app-mark" src="./favicon.png" alt="" aria-hidden="true">
                    <div class="brand-copy">
                        <p class="eyebrow">Repo Reader</p>
                        <h1>Explorer documentazione</h1>
                    </div>
                </div>
            </div>
        </header>

        <div class="contextbar">
            <button type="button" id="parent-folder-button" class="path-button icon-action" aria-label="Vai alla cartella superiore" title="Vai alla cartella superiore">
                <span class="icon-parent-folder" aria-hidden="true"></span>
                <span class="visually-hidden">Cartella superiore</span>
            </button>
            <div id="breadcrumbs" class="breadcrumbs topbar-pathbar"></div>
            <p id="root-path" class="subtle contextbar-path"></p>
            <button type="button" id="choose-workspace" class="workspace-action icon-action" aria-label="Cambia workspace" title="Cambia workspace">
                <span class="icon-workspace" aria-hidden="true"></span>
                <span class="visually-hidden">Cambia workspace</span>
            </button>
        </div>

        <main class="workspace">
            <aside class="activity-rail" aria-label="Selettore pannelli laterali">
                <div class="activity-group" role="group" aria-label="Pannelli laterali">
                    <button type="button" id="sidebar-toggle" class="activity-button is-active" aria-pressed="true" aria-label="Mostra o nascondi explorer" title="Mostra o nascondi explorer" data-activity-kind="documents">
                        <span class="activity-button-text" data-sidebar-label>Explorer</span>
                        </button>
                        <button type="button" id="toc-toggle" class="activity-button" aria-pressed="false" aria-label="Pannello indice" title="Pannello indice" data-activity-kind="toc">
                            <span class="activity-button-text">Indice</span>
                        </button>
                </div>
            </aside>

            <aside class="sidebar panel" id="sidebar">
                <div id="explorer-panel" class="sidebar-panel is-active">
                    <div class="panel-head panel-head-compact">
                        <span>Explorer</span>
                        <span id="entry-count" class="badge"></span>
                    </div>
                    <div class="sidebar-tools">
                        <input id="search-input" type="search" placeholder="Filtra cartella o file...">
                        <button type="button" id="clear-filter" class="icon-action" aria-label="Pulisci filtro" title="Pulisci filtro">
                            <span class="icon-clear-filter" aria-hidden="true"></span>
                            <span class="visually-hidden">Pulisci filtro</span>
                        </button>
                    </div>
                    <div id="file-list" class="file-list"></div>
                </div>
                    <div id="toc-panel" class="sidebar-panel" hidden>
                        <div class="panel-head panel-head-compact">
                            <span>Indice</span>
                            <span id="toc-count" class="badge"></span>
                        </div>
                        <div id="toc-list" class="toc-list-sidebar"></div>
                    </div>
            </aside>

            <section class="content">
                <div class="workbench-header panel-head panel-head-compact">
                    <div class="panel-title-group document-header-group">
                        <p id="selected-file-heading" class="document-heading">Nessun file selezionato (anteprima)</p>
                        <p id="selected-file" class="subtle subtle-inline"></p>
                    </div>
                    <button type="button" id="mode-toggle" class="mode-switch icon-action" aria-pressed="false" aria-label="Attiva modalità modifica" title="Attiva modalità modifica">
                        <span class="mode-switch-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Modalità modifica</span>
                    </button>
                    <div class="toolbar workbench-toolbar">
                        <span id="selected-type" class="badge">none</span>
                        <button type="button" id="save-file" class="primary-action icon-action" aria-label="Salva file" title="Salva file" disabled>
                            <span class="icon-save" aria-hidden="true"></span>
                            <span class="visually-hidden">Salva</span>
                        </button>
                        <div class="overflow-actions" id="overflow-actions">
                            <button type="button" id="overflow-button" class="icon-action" aria-haspopup="menu" aria-expanded="false" aria-label="Azioni documento" title="Azioni documento">
                                <span class="icon-overflow" aria-hidden="true"></span>
                                <span class="visually-hidden">Azioni documento</span>
                            </button>
                            <div id="overflow-menu" class="action-menu" hidden>
                                <button type="button" data-overflow-action="refresh">Aggiorna contenuto</button>
                                <button type="button" data-overflow-action="open-folder">Apri cartella di sistema</button>
                                <button type="button" data-overflow-action="open-code">Apri in VS Code</button>
                                <div class="action-menu-divider"></div>
                                <button type="button" data-print-mode="print">Stampa documento</button>
                                <button type="button" data-print-mode="pdf">Esporta PDF</button>
                            </div>
                        </div>
                    </div>
                </div>

                <article class="panel document-panel workbench-panel">
                    <div id="preview" class="preview"></div>
                    <div class="editor-stage">
                        <div id="editor-host" class="editor-host" hidden></div>
                        <textarea id="editor" class="editor-fallback" spellcheck="false" placeholder="Seleziona un file modificabile..."></textarea>
                    </div>
                </article>
            </section>
        </main>

        <footer class="statusbar">
            <div class="statusbar-section">
                <span id="status">Pronto.</span>
            </div>
            <div class="statusbar-section statusbar-meta">
                <span>Preview ed editor condividono lo stesso contenuto attivo.</span>
            </div>
        </footer>
    </div>

    <div id="print-dialog" class="modal-shell" hidden>
        <div class="modal-backdrop" data-modal-close="print"></div>
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="print-dialog-title">
            <header class="modal-head">
                <div>
                    <p class="eyebrow">Documentazione tecnica</p>
                    <h2 id="print-dialog-title">Parametri esportazione</h2>
                </div>
                <button type="button" id="close-print-dialog" class="icon-button" aria-label="Chiudi finestra">Chiudi</button>
            </header>

            <div class="modal-body">
                <label class="menu-field" for="print-dialog-preset">
                    <span>Preset</span>
                    <select id="print-dialog-preset">
                        <option value="restricted">Riservato</option>
                        <option value="internal">Interno</option>
                        <option value="nda">Partner</option>
                        <option value="public">Pubblico</option>
                    </select>
                </label>

                <label class="menu-field" for="print-dialog-author-name">
                    <span>Autore</span>
                    <input id="print-dialog-author-name" type="text" placeholder="Nome e cognome">
                </label>

                <label class="checkbox-field" for="print-dialog-include-organization">
                    <input id="print-dialog-include-organization" type="checkbox">
                    <span>Inserisci organizzazione nel documento</span>
                </label>

                <label class="menu-field" for="print-dialog-organization-name">
                    <span>Organizzazione</span>
                    <input id="print-dialog-organization-name" type="text" placeholder="Nome organizzazione">
                </label>
            </div>

            <footer class="modal-actions">
                <button type="button" id="cancel-print-dialog">Annulla</button>
                <button type="button" id="confirm-print-dialog">Conferma</button>
            </footer>
        </section>
    </div>

    <script src="../../node_modules/monaco-editor/min/vs/loader.js"></script>
    <script src="./renderer.js"></script>
</body>
</html>
